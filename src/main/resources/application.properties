spring.application.name=Drone_Detection

# =========================================================
# DATABASE CONFIGURATION
# =========================================================
# Local development:
# MYSQLHOST      = localhost
# MYSQLPORT      = 3306
# MYSQLDATABASE  = drone_platform
# MYSQLUSER      = root
# MYSQLPASSWORD  = eliyas
#
# Production:
# These values will be supplied as environment variables.
# =========================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:drone_platform}?useSSL=${MYSQLSSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=${MYSQLUSER:root}

spring.datasource.password=${MYSQLPASSWORD:eliyas}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# JSON
# =========================================================




# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.web=INFO
